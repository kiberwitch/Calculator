<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сalculator</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="icon" href="icons8-calculator-100.png" type="image/x-icon">
    <link rel="shortcut icon" href="icons8-calculator-100.png" type="image/x-icon">
  </head>
  <body>
    <div class="calc">
      <div class="calc-screen">
        <input type="text" id="display" readonly />
      </div>
      <div class="buttons">
        <div class="btn ac grey">AC</div>
        <div class="btn plus-minus grey">+/-</div>
        <div class="btn percent grey">%</div>
        <div class="btn divide orange">÷</div>

        <div class="btn seven">7</div>
        <div class="btn eight">8</div>
        <div class="btn nine">9</div>
        <div class="btn multiply orange">×</div>

        <div class="btn four">4</div>
        <div class="btn five">5</div>
        <div class="btn six">6</div>
        <div class="btn minus orange">-</div>

        <div class="btn one">1</div>
        <div class="btn two">2</div>
        <div class="btn three">3</div>
        <div class="btn plus orange">+</div>

        <div class="btn zero">0</div>
        <div class="btn decimal">.</div>
        <div class="btn equals orange">=</div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
